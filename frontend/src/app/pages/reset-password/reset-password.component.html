<div class="reset-password-container">
  <h2>Réinitialisation du mot de passe</h2>
  <form (ngSubmit)="onSubmit()">
    <input type="password" [(ngModel)]="password" name="password" placeholder="Nouveau mot de passe" required>
    <input type="password" [(ngModel)]="confirm" name="confirm" placeholder="Confirmer mot de passe" required>
    <button type="submit">Valider</button>
  </form>
</div>
